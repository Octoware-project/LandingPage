<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cooperativa Esi</title>
</head>
<body>
    
    <div class="nombreCooperativa">
    <h1>COOPERATIVA ESI</h1>
    <a href="/CooperativaESI/Aplicacion/FrontEnd_Login/index.php">
        <button>Iniciar sesión</button>
    </a>
    </div>
    
    <div class="cajaDeImagenes">
    <h2>Sobre nosotros</h2>
        <div class="contenedor-caja">
            <div class="menu-botones">
            <button onclick="mostrarImagen('vision')">Visión</button>
            <button onclick="mostrarImagen('mision')">Misión</button>
            <button onclick="mostrarImagen('objetivos')">Objetivos</button>
            </div>
            <div class="imagen-contenido">
            <img src="img/image.png" alt="Visión" id="img-vision" class="imagen">
            <img src="img/image.png" alt="Misión" id="img-mision" class="imagen">
            <img src="img/image.png" alt="Objetivos" id="img-objetivos" class="imagen">
            </div>
        </div>
    </div>


    <div class="fondoFormulario">
        <div class="formulario">
            <h2>Si deseas unirte completa este formulario</h2>
            
                <form id="registroForm">
                    Nombre: <input type="text" name="nombre" value="Josefina" required> <br>
                    Apellido: <input type="text" name="apellido" value="Perez" required> <br>
                    Email: <input type="email" name="mail" value="JPerez@test.com" required> <br>
                    Password: <input type="password" name="password" value="12345678" required> <br>
                    C.I: <input type="number" name="CI" value="11122233" required> <br>
                    Teléfono: <input type="tel" name="telefono" value="099123123" required> <br>
                    Dirección: <input type="text" name="direccion" value="Rivera 1232" required> <br>

                    <input type="hidden" name="Tipo_Persona" value="Usuario">
                    <input type="hidden" name="Estado_Registro" value="Pendiente">

                    <button type="submit">Enviar</button>
                </form>
                <script>
        document.getElementById("registroForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const form = event.target;
        const data = {
            nombre: form.nombre.value,
            apellido: form.apellido.value,
            email: form.mail.value,
            password: form.password.value,
            CI: parseInt(form.CI.value),
            Telefono: form.telefono.value,
            Direccion: form.direccion.value,
            Estado_Registro: form.Estado_Registro.value,
            Tipo_Persona: form.Tipo_Persona.value
        };

        fetch("http://localhost/CooperativaESI/API_Usuarios/public/api/registrar", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
            throw new Error("Error en la solicitud: " + response.status);
            }
            return response.json();
        })
        .then(json => {
            alert("Registro exitoso!");
            console.log(json);
        })
        .catch(error => {
            alert("Error al registrar: " + error.message);
            console.error(error);
        });
        });
  </script>
        
        </div>
    </div>
        
</body>
</html>
