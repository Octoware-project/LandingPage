<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="iniciarSesion.css">
  <title>Inicio de Sesión</title>
</head>
<body>
  <h1 style="text-align:center;">Iniciar Sesión</h1>

  <input type="radio" name="login" id="administrador" />
  <label for="administrador">Usuarios</label>

  <div class="formulario admin-form">
    <form id="formulario">
      Usuario: <input type="text" id="usuario" required /><br /><br />
      Contraseña: <input type="password" id="clave" required /><br /><br />

      <button type="submit">Iniciar</button><br /><br />
    </form>
  </div>
  
  <script src="iniciarSesion.js"></script>
</body>
</html>
